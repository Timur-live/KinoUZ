

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KinoUZ — Мир кино</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:white;font-family:Arial,sans-serif}
header{padding:18px 5%;display:flex;align-items:center;justify-content:space-between;background:#111;position:sticky;top:0;z-index:5}
.logo{font-size:27px;font-weight:bold;color:#ed1834}
.logo span{color:white}
nav a{color:#ddd;text-decoration:none;margin-left:15px;font-size:14px}
.hero{min-height:390px;padding:65px 6%;display:flex;align-items:end;background:linear-gradient(90deg,#080808 10%,#08080899 65%,transparent),url('https://image.tmdb.org/t/p/original/8b8R8l88Qje9dn9OE8PY05Nxl1X.jpg') center/cover}
.hero h1{font-size:42px;margin:0 0 12px}
.hero p{max-width:430px;color:#ddd;line-height:1.6}
.btn{display:inline-block;background:#e50927;color:white;padding:13px 22px;border:0;border-radius:5px;text-decoration:none;font-weight:bold;cursor:pointer}
main{padding:25px 5%}
.search{width:100%;padding:15px;background:#191919;color:white;border:1px solid #333;border-radius:7px;font-size:16px;margin:15px 0}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:25px}
.filters button{background:#222;color:white;border:1px solid #444;padding:10px 16px;border-radius:20px;cursor:pointer}
.filters button.active{background:#e50927;border-color:#e50927}
h2{font-size:23px;margin:28px 0 17px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:17px}
.movie{background:#151515;border-radius:8px;overflow:hidden;transition:.2s}
.movie:hover{transform:translateY(-5px)}
.movie img{width:100%;height:220px;object-fit:cover;background:#222}
.movie-info{padding:11px}
.movie h3{font-size:15px;margin:0 0 8px}
.movie p{color:#aaa;font-size:12px;margin:0 0 10px}
.movie button{width:100%;padding:9px;background:#e50927;color:white;border:0;border-radius:4px;cursor:pointer}
footer{text-align:center;padding:30px;color:#777;background:#111;margin-top:35px}
.modal{display:none;position:fixed;inset:0;background:#000e;z-index:10;align-items:center;justify-content:center;padding:20px}
.modal-box{background:#191919;padding:22px;border-radius:10px;width:100%;max-width:600px}
.modal iframe{width:100%;aspect-ratio:16/9;border:0}
.close{float:right;background:#333;color:white;border:0;padding:8px 13px;border-radius:5px}
@media(max-width:600px){.hero{min-height:330px;padding:35px 6%}.hero h1{font-size:30px}nav a{margin-left:8px;font-size:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.movie img{height:220px}}
</style>
</head>
<body>
<header>
<div class="logo">Kino<span>UZ</span></div>
<nav><a href="#">Главная</a><a href="#catalog">Фильмы</a></nav>
</header>

<section class="hero">
<div>
<h1>Мир большого кино</h1>
<p>Смотри трейлеры, открывай новые фильмы и находи кино по своему вкусу.</p>
<a href="#catalog" class="btn">Смотреть каталог</a>
</div>
</section>

<main id="catalog">
<h2>🎬 Каталог фильмов</h2>
<input class="search" id="search" placeholder="🔎 Поиск фильма..." oninput="render()">
<div class="filters" id="filters">
<button class="active" onclick="setGenre('Все',this)">Все</button>
<button onclick="setGenre('Боевик',this)">Боевики</button>
<button onclick="setGenre('Комедия',this)">Комедии</button>
<button onclick="setGenre('Фантастика',this)">Фантастика</button>
<button onclick="setGenre('Драма',this)">Драмы</button>
</div>
<div class="grid" id="movies"></div>
</main>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
<div class="modal-box">
<button class="close" onclick="closeModal()">Закрыть ✕</button>
<h3 id="modalTitle">Трейлер фильма</h3>
<iframe id="player" allowfullscreen></iframe>
</div>
</div>

<footer>© 2026 KinoUZ — Твой мир кино</footer>

<script>
const films=[
{t:"Интерстеллар",g:"Фантастика",y:2014,i:"gEU2QniE6E77NI6lCU6MxlNBvIx",v:"zSWdZVtXT7E"},
{t:"Начало",g:"Фантастика",y:2010,i:"oYuLEt3zVCKq57qu2F8dT7NIa6f",v:"YoHD9XEInc0"},
{t:"Джон Уик",g:"Боевик",y:2014,i:"fZPSd91yGE9fCcCe6OoQr6E3Bev",v:"C0BMx-qxsP4"},
{t:"Матрица",g:"Фантастика",y:1999,i:"f89U3ADr1oiB1s9GkdPOEpXUk5H",v:"vKQi3bBA1y8"},
{t:"Гладиатор",g:"Боевик",y:2000,i:"ty8TGRuvJLPUmAR1H1nRIsgwvim",v:"owK1qxDselE"},
{t:"Зелёная миля",g:"Драма",y:1999,i:"8VG8fDNiy50H4FedGwdSVUPoaJe",v:"Ki4haFrqSrw"},
{t:"Один дома",g:"Комедия",y:1990,i:"onTSipZ8R3bliBdKfPtsDuHTdlL",v:"jEDaVHmw7r4"},
{t:"Аватар",g:"Фантастика",y:2009,i:"kyeqWdyUXW608qlYkRqosgbbJyK",v:"5PSNL1qE6VY"}
];
let genre="Все";
function setGenre(g,b){
genre=g;
document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));
b.classList.add('active');
render();
}
function render(){
let q=document.getElementById('search').value.toLowerCase();
let list=films.filter(f=>(genre==="Все"||f.g===genre)&&f.t.toLowerCase().includes(q));
document.getElementById('movies').innerHTML=list.length?list.map(f=>`
<div class="movie">
<img src="https://image.tmdb.org/t/p/w500/${f.i}.jpg" alt="${f.t}" loading="lazy">
<div class="movie-info">
<h3>${f.t}</h3>
<p>${f.y} · ${f.g}</p>
<button onclick="openModal('${f.t}','${f.v}')">▶ Смотреть трейлер</button>
</div></div>`).join(''):'<p>Фильмы не найдены</p>';
}
function openModal(t,v){
document.getElementById('modalTitle').textContent=t;
document.getElementById('player').src='https://www.youtube.com/embed/'+v;
document.getElementById('modal').style.display='flex';
}
function closeModal(){
document.getElementById('modal').style.display='none';
document.getElementById('player').src='';
}
render();
</script>
</body>
</html>
