

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KinoUZ — Смотреть фильмы</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090d18;color:white;font-family:Arial,sans-serif}
header{padding:22px 16px;background:#111827;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:27px;font-weight:bold;color:#ff3434}
nav a{color:white;text-decoration:none;margin-left:12px;font-size:13px}
.hero{padding:55px 20px;text-align:center;background:linear-gradient(135deg,#241326,#101c36)}
.hero h1{font-size:34px;margin:0 0 12px}
.hero p{color:#ccc}
.search{display:block;width:90%;max-width:450px;margin:20px auto;padding:15px;border:0;border-radius:10px;background:#202a3c;color:white}
h2{padding:0 16px}
.movies{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;padding:15px}
.movie{background:#151e2e;border-radius:12px;overflow:hidden;text-align:center;padding-bottom:15px}
.poster{height:190px;display:flex;align-items:center;justify-content:center;font-size:65px;background:linear-gradient(145deg,#292d48,#151a29)}
.movie h3{font-size:16px;margin:12px 5px}
.movie button{background:#ff3434;color:white;border:0;padding:10px 18px;border-radius:7px}
footer{text-align:center;padding:25px;color:#999;background:#111827;margin-top:30px}
</style>
</head>
<body>
<header>
<div class="logo">KinoUZ 🎬</div>
<nav><a href="#">Главная</a><a href="#films">Фильмы</a></nav>
</header>
<section class="hero">
<h1>Мир кино начинается здесь</h1>
<p>Смотри. Выбирай. Наслаждайся.</p>
</section>
<input class="search" id="search" placeholder="🔍 Поиск фильмов..." oninput="findMovies()">
<h2 id="films">🔥 Популярные фильмы</h2>
<div class="movies" id="movies">
<div class="movie"><div class="poster">🎬</div><h3>Интерстеллар</h3><button onclick="showMovie('Интерстеллар')">Подробнее</button></div>
<div class="movie"><div class="poster">🚀</div><h3>Начало</h3><button onclick="showMovie('Начало')">Подробнее</button></div>
<div class="movie"><div class="poster">🦇</div><h3>Тёмный рыцарь</h3><button onclick="showMovie('Тёмный рыцарь')">Подробнее</button></div>
<div class="movie"><div class="poster">🌌</div><h3>Аватар</h3><button onclick="showMovie('Аватар')">Подробнее</button></div>
<div class="movie"><div class="poster">🕷️</div><h3>Человек-паук</h3><button onclick="showMovie('Человек-паук')">Подробнее</button></div>
<div class="movie"><div class="poster">🏎️</div><h3>Форсаж</h3><button onclick="showMovie('Форсаж')">Подробнее</button></div>
</div>
<footer>© 2026 KinoUZ | Мир кино</footer>
<script>
function findMovies(){
let q=document.getElementById('search').value.toLowerCase();
document.querySelectorAll('.movie').forEach(m=>{
m.style.display=m.innerText.toLowerCase().includes(q)?'block':'none';
});
}
function showMovie(name){
alert('Вы выбрали фильм: '+name);
}
</script>
</body>
</html>
