

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KinoUZ — Мир кино</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101014;color:white;font-family:Arial,sans-serif}
header{background:#19191f;padding:20px 5%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.logo{font-size:27px;font-weight:bold;color:#ffca28}
.logo span{color:white}
button,input{font:inherit}
button{cursor:pointer;border:0;border-radius:7px;padding:10px 15px}
.lang{background:#ffca28;color:#111;font-weight:bold}
.hero{padding:55px 6%;background:linear-gradient(90deg,#17131c,#442020);text-align:center}
.hero h1{font-size:36px;margin:0 0 12px}
.hero p{color:#ddd}
.search{width:min(600px,90%);padding:15px;border:0;border-radius:8px;margin-top:18px}
.section{padding:25px 5%}
.section h2{color:#ffca28}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.filters button{background:#292930;color:white}
.filters button.active{background:#ffca28;color:#111}
.movies{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:18px}
.movie{background:#202027;border-radius:10px;overflow:hidden;cursor:pointer;transition:.2s}
.movie:hover{transform:translateY(-5px)}
.poster{height:210px;display:flex;align-items:center;justify-content:center;font-size:55px;background:linear-gradient(145deg,#563a55,#191a34)}
.poster.p2{background:linear-gradient(145deg,#315b68,#17202d)}
.poster.p3{background:linear-gradient(145deg,#9a542b,#30202a)}
.poster.p4{background:linear-gradient(145deg,#4a4c83,#171725)}
.poster.p5{background:linear-gradient(145deg,#466b44,#192a22)}
.poster.p6{background:linear-gradient(145deg,#805c32,#27202a)}
.info{padding:12px}
.info h3{font-size:15px;margin:0 0 8px}
.info p{font-size:12px;color:#aaa;margin:0}
.rating{color:#ffca28;margin-top:8px;font-size:13px}
footer{text-align:center;padding:30px;color:#888;background:#19191f}
.modal{display:none;position:fixed;inset:0;background:#000d;z-index:5;align-items:center;justify-content:center;padding:18px}
.modalbox{background:#25252d;padding:25px;border-radius:12px;width:min(450px,100%)}
.modalbox h2{color:#ffca28}
.modalbox p{line-height:1.6;color:#ddd}
.close{float:right;background:#444;color:white}
.trailer{background:#ffca28;color:#111;font-weight:bold;margin-top:12px}
</style>
</head>
<body>

<header>
<div class="logo">Kino<span>UZ</span></div>
<button class="lang" onclick="changeLang()" id="lang">UZ</button>
</header>

<section class="hero">
<h1 id="welcome">Мир кино начинается здесь!</h1>
<p id="subtitle">Смотри, выбирай и открывай новые фильмы</p>
<input class="search" id="search" placeholder="Поиск фильмов..." oninput="render()">
</section>

<section class="section">
<h2 id="catalog">Каталог фильмов</h2>
<div class="filters" id="filters"></div>
<div class="movies" id="movies"></div>
</section>

<div class="modal" id="modal">
<div class="modalbox">
<button class="close" onclick="closeModal()">✕</button>
<div id="details"></div>
</div>
</div>

<footer>
<div class="logo">KinoUZ</div>
<p>© 2026 KinoUZ. Все права защищены.</p>
<p>Каталог фильмов и трейлеров</p>
</footer>

<script>
const films=[
{id:1,ru:"Интерстеллар",uz:"Interstellar",genre:"Фантастика",guz:"Fantastika",year:2014,emoji:"🚀",poster:"",rating:"8.7",desc:"Путешествие через космос ради спасения человечества.",trailer:"Interstellar official trailer"},
{id:2,ru:"Начало",uz:"Boshlanish",genre:"Фантастика",guz:"Fantastika",year:2010,emoji:"🌌",rating:"8.8",desc:"История о проникновении в человеческие сны.",trailer:"Inception official trailer"},
{id:3,ru:"Гладиатор",uz:"Gladiator",genre:"Боевик",guz:"Jangari",year:2000,emoji:"⚔️",rating:"8.5",desc:"История римского полководца, ставшего гладиатором.",trailer:"Gladiator official trailer"},
{id:4,ru:"Побег из Шоушенка",uz:"Shoushenkdan qochish",genre:"Драма",guz:"Drama",year:1994,emoji:"🔑",rating:"9.3",desc:"История дружбы, надежды и свободы.",trailer:"Shawshank Redemption official trailer"},
{id:5,ru:"Веном",uz:"Venom",genre:"Фантастика",guz:"Fantastika",year:2018,emoji:"🕷️",rating:"6.6",desc:"Журналист сталкивается с необычным симбиотом.",trailer:"Venom official trailer"},
{id:6,ru:"Джокер",uz:"Joker",genre:"Драма",guz:"Drama",year:2019,emoji:"🎭",rating:"8.1",desc:"История человека, меняющегося под давлением общества.",trailer:"Joker official trailer"}
];

let uz=false,genre="all";

function t(ru,uzbek){return uz?uzbek:ru}

function changeLang(){
uz=!uz;
document.getElementById("lang").textContent=uz?"RU":"UZ";
document.getElementById("welcome").textContent=t("Мир кино начинается здесь!","Kino olami shu yerdan boshlanadi!");
document.getElementById("subtitle").textContent=t("Смотри, выбирай и открывай новые фильмы","Tomosha qiling va yangi filmlarni kashf eting");
document.getElementById("search").placeholder=t("Поиск фильмов...","Filmlarni qidirish...");
document.getElementById("catalog").textContent=t("Каталог фильмов","Filmlar katalogi");
render();
}

function render(){
const categories=[
["all","Все","Barchasi"],
["Фантастика","Фантастика","Fantastika"],
["Боевик","Боевик","Jangari"],
["Драма","Драма","Drama"]
];
document.getElementById("filters").innerHTML=categories.map(c=>
`<button class="${genre===c[0]?'active':''}" onclick="setGenre('${c[0]}')">${t(c[1],c[2])}</button>`
).join("");

let q=document.getElementById("search").value.toLowerCase();
let list=films.filter(f=>
(genre==="all"||f.genre===genre)&&
(f.ru.toLowerCase().includes(q)||f.uz.toLowerCase().includes(q))
);

document.getElementById("movies").innerHTML=list.map(f=>
`<div class="movie" onclick="showFilm(${f.id})">
<div class="poster p${f.id}">${f.emoji}</div>
<div class="info">
<h3>${uz?f.uz:f.ru}</h3>
<p>${f.year} • ${uz?f.guz:f.genre}</p>
<div class="rating">★ ${f.rating}</div>
</div></div>`
).join("")||`<p>${t("Фильмы не найдены","Filmlar topilmadi")}</p>`;
}

function setGenre(g){genre=g;render()}

function showFilm(id){
const f=films.find(x=>x.id===id);
document.getElementById("details").innerHTML=`
<h2>${uz?f.uz:f.ru}</h2>
<p>${f.year} • ${uz?f.guz:f.genre} • ★ ${f.rating}</p>
<p>${f.emoji} ${f.desc}</p>
<button class="trailer" onclick="openTrailer(${id})">${t("Смотреть трейлер","Treylerni ko'rish")}</button>`;
document.getElementById("modal").style.display="flex";
}

function openTrailer(id){
let f=films.find(x=>x.id===id);
window.open("https://www.youtube.com/results?search_query="+encodeURIComponent(f.trailer),"_blank");
}

function closeModal(){
document.getElementById("modal").style.display="none";
}

render();
</script>
</body>
</html>
