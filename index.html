

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KinoUZ PREMIUM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080808;color:white;font-family:Arial,sans-serif}
header{padding:20px 5%;background:#101010;border-bottom:1px solid #a77a29;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px}
.logo{font-size:29px;font-weight:bold;color:#d7ae54}
.logo span{color:white}
nav{display:flex;gap:20px}
nav a{color:#ddd;text-decoration:none;font-size:14px}
nav a:hover{color:#d7ae54}
.hero{padding:75px 7%;min-height:350px;background:linear-gradient(90deg,#080808 10%,rgba(8,8,8,.8),rgba(8,8,8,.1)),url('https://image.tmdb.org/t/p/original/8b8R8l88Qje9dn9OE8PY05Nxl1X.jpg') center/cover}
.tag{color:#d7ae54;letter-spacing:4px}
.hero h1{font-size:45px;margin:20px 0}
.hero p{color:#ccc;max-width:450px;line-height:1.7}
.goldbtn{background:linear-gradient(90deg,#a77a29,#f2d17b);color:#111;border:0;padding:13px 23px;border-radius:5px;font-weight:bold;cursor:pointer;margin-top:20px}
.search{padding:25px 5%}
.search input{width:100%;padding:15px;background:#181818;border:1px solid #80632e;color:white;border-radius:5px;font-size:16px}
h2{padding:15px 5%;font-size:24px}
h2 span{color:#d7ae54}
.categories{display:flex;gap:10px;padding:10px 5%;overflow-x:auto}
.categories button{background:#191919;border:1px solid #604b28;color:white;padding:10px 18px;border-radius:20px;white-space:nowrap;cursor:pointer}
.categories button.active,.categories button:hover{background:#d7ae54;color:#111}
.movies{padding:20px 5%;display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:20px}
.movie{background:#151515;border:1px solid #29231a;border-radius:8px;overflow:hidden;cursor:pointer;transition:.3s}
.movie:hover{transform:translateY(-5px);border-color:#d7ae54}
.poster{height:230px;position:relative;background:#202020}
.poster img{width:100%;height:100%;object-fit:cover}
.rating{position:absolute;top:9px;right:9px;background:#d7ae54;color:#111;padding:6px 8px;border-radius:4px;font-size:12px;font-weight:bold}
.movie h3{padding:12px 10px 6px;font-size:15px}
.movie p{padding:0 10px 12px;color:#aaa;font-size:12px}
.empty{text-align:center;color:#aaa;padding:30px;display:none}
footer{text-align:center;padding:35px;background:#101010;border-top:1px solid #705626;color:#999;margin-top:30px}
footer strong{color:#d7ae54;font-size:25px}

/* ОКНО ФИЛЬМА */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:1000;overflow-y:auto;padding:25px 12px}
.modal.show{display:flex;justify-content:center;align-items:center}
.modal-content{width:100%;max-width:750px;background:#151515;border:1px solid #b18a38;border-radius:12px;overflow:hidden;position:relative;animation:appear .25s}
@keyframes appear{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.close{position:absolute;right:15px;top:15px;width:40px;height:40px;border:0;border-radius:50%;background:#d7ae54;color:#111;font-size:25px;cursor:pointer;z-index:2}
.detail-top{height:250px;background:#222;position:relative}
.detail-top img{width:100%;height:100%;object-fit:cover;opacity:.65}
.detail-top:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent,#151515)}
.detail-info{padding:25px}
.detail-info h2{padding:0;color:#e5bd69;font-size:30px}
.meta{color:#d7ae54;margin:15px 0;font-size:14px;line-height:2}
.description{color:#ccc;line-height:1.8;font-size:15px;margin:15px 0}
.modal-actions{display:flex;gap:12px;flex-wrap:wrap}
.modal-actions button{margin:0}
.secondary{background:#292929;color:#fff;border:1px solid #b18a38;padding:13px 20px;border-radius:5px;cursor:pointer}
@media(max-width:600px){
.hero{padding:60px 6%}
.hero h1{font-size:34px}
.movies{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.poster{height:200px}
nav{width:100%;gap:14px}
.detail-top{height:190px}
.detail-info h2{font-size:24px}
}
</style>
</head>
<body>

<header>
<div class="logo">Kino<span>UZ</span></div>
<nav>
<a href="#home">Главная</a>
<a href="#movies">Фильмы</a>
<a href="#genres">Жанры</a>
</nav>
</header>

<section class="hero" id="home">
<div class="tag">KINO UZ • PREMIUM</div>
<h1>Мир большого кино</h1>
<p>Открой для себя лучшие фильмы. Большие истории и незабываемые эмоции.</p>
<button class="goldbtn" onclick="document.getElementById('movies').scrollIntoView({behavior:'smooth'})">Смотреть фильмы ▶</button>
</section>

<div class="search">
<input id="search" placeholder="🔍 Найти фильм..." oninput="renderMovies()">
</div>

<h2 id="genres">Выбери <span>жанр</span></h2>
<div class="categories">
<button class="active" onclick="setGenre('Все',this)">Все</button>
<button onclick="setGenre('Боевик',this)">Боевики</button>
<button onclick="setGenre('Комедия',this)">Комедии</button>
<button onclick="setGenre('Драма',this)">Драмы</button>
<button onclick="setGenre('Фантастика',this)">Фантастика</button>
<button onclick="setGenre('Приключения',this)">Приключения</button>
</div>

<h2 id="movies">Популярное <span>кино</span></h2>
<div class="movies" id="movieList"></div>
<div class="empty" id="empty">Фильмы не найдены</div>

<footer>
<strong>KinoUZ PREMIUM</strong>
<p style="margin-top:12px">Твой мир большого кино</p>
<p style="margin-top:10px">© 2026 KinoUZ</p>
</footer>

<!-- ОКНО С ПОДРОБНОСТЯМИ -->
<div class="modal" id="movieModal" onclick="outsideClose(event)">
<div class="modal-content">
<button class="close" onclick="closeMovie()">×</button>
<div class="detail-top">
<img id="detailImage" src="" alt="Постер фильма">
</div>
<div class="detail-info">
<h2 id="detailTitle"></h2>
<div class="meta" id="detailMeta"></div>
<p class="description" id="detailDescription"></p>
<div class="modal-actions">
<button class="goldbtn" id="trailerButton">▶ Смотреть трейлер</button>
<button class="secondary" onclick="closeMovie()">← Назад к фильмам</button>
</div>
</div>
</div>
</div>

<script>
const films=[
{title:"Интерстеллар",genre:"Фантастика",year:2014,rating:"8.7",time:"169 мин.",id:157336,desc:"Команда исследователей отправляется через космическую червоточину, чтобы найти новый дом для человечества."},
{title:"Начало",genre:"Фантастика",year:2010,rating:"8.8",time:"148 мин.",id:27205,desc:"Профессионал проникает в сны людей и получает необычное задание изменить чужое сознание."},
{title:"Джон Уик",genre:"Боевик",year:2014,rating:"7.4",time:"101 мин.",id:245891,desc:"Бывший наёмный убийца возвращается в опасный мир криминала."},
{title:"Форсаж 7",genre:"Боевик",year:2015,rating:"7.1",time:"137 мин.",id:168259,desc:"Команда снова объединяется ради захватывающих гонок и опасных приключений."},
{title:"Маска",genre:"Комедия",year:1994,rating:"6.9",time:"101 мин.",id:9312,desc:"Обычный банковский служащий находит волшебную маску, которая меняет его жизнь."},
{title:"Один дома",genre:"Комедия",year:1990,rating:"7.7",time:"103 мин.",id:771,desc:"Мальчик случайно остаётся один дома и придумывает хитрые ловушки для грабителей."},
{title:"Зелёная миля",genre:"Драма",year:1999,rating:"8.6",time:"189 мин.",id:497,desc:"История необычного заключённого и охранников тюремного блока смертников."},
{title:"Побег из Шоушенка",genre:"Драма",year:1994,rating:"9.3",time:"142 мин.",id:278,desc:"История дружбы, надежды и стремления к свободе в стенах тюрьмы."},
{title:"Аватар",genre:"Фантастика",year:2009,rating:"7.9",time:"162 мин.",id:19995,desc:"На далёкой планете человек оказывается перед выбором между двумя мирами."},
{title:"Гладиатор",genre:"Боевик",year:2000,rating:"8.2",time:"155 мин.",id:98,desc:"Полководец теряет всё и становится гладиатором, чтобы восстановить справедливость."},
{title:"Джуманджи",genre:"Приключения",year:2017,rating:"6.9",time:"119 мин.",id:353486,desc:"Четверо подростков попадают внутрь опасной компьютерной игры."},
{title:"Пираты Карибского моря",genre:"Приключения",year:2003,rating:"8.1",time:"143 мин.",id:22,desc:"Капитан Джек Воробей отправляется в невероятное морское приключение."}
];

const posters={
157336:"gEU2QniE6E77NI6lCU6MxlNBvIx.jpg",
27205:"oYuLEt3zVCKq57qu2F8dT7NIa6f.jpg",
245891:"fZPSd91yGE9fCcCe6OoQr6E3Bev.jpg",
168259:"dCgm7efXDmiABSdWDHBDBx2jwmn.jpg",
9312:"a0W7buhwZqYf8a6mFqD7J3G5J9a.jpg",
771:"uuitWHpJwxD1wruFl2nZHIb4UGN.jpg",
497:"velWPhVMQeQKcxggNEU8YmIo52R.jpg",
278:"hBcY0fE9pfXzvVaY4GKarweri1f.jpg",
19995:"kyeqWdyUXW608qlYkRqosgbbJyK.jpg",
98:"ty8TGRuvJLPUmAR1H1nRIsgwvim.jpg",
353486:"bB42KDdfWkOvmzmYkmK58ZlCa9P.jpg",
22:"tkt9xR1kNX5R9rCebASKck44si2.jpg"
};

function posterUrl(id){
return "https://image.tmdb.org/t/p/w500/"+posters[id];
}

let selectedGenre="Все";

function setGenre(genre,button){
selectedGenre=genre;
document.querySelectorAll(".categories button").forEach(b=>b.classList.remove("active"));
button.classList.add("active");
renderMovies();
}

function renderMovies(){
const query=document.getElementById("search").value.toLowerCase();
const list=document.getElementById("movieList");
list.innerHTML="";
const filtered=films.filter(f=>
f.title.toLowerCase().includes(query)&&
(selectedGenre==="Все"||f.genre===selectedGenre)
);
document.getElementById("empty").style.display=filtered.length?"none":"block";

filtered.forEach(f=>{
const card=document.createElement("div");
card.className="movie";
card.innerHTML=`
<div class="poster">
<img loading="lazy" src="${posterUrl(f.id)}" alt="">
<div class="rating">⭐ ${f.rating}</div>
</div>
<h3></h3>
<p>${f.year} · ${f.genre}</p>`;
card.querySelector("h3").textContent=f.title;
card.querySelector(".poster img").onerror=function(){
this.style.display="none";
};
card.onclick=()=>openMovie(f.id);
list.appendChild(card);
});
}

function openMovie(id){
const f=films.find(item=>item.id===id);
if(!f)return;
document.getElementById("detailTitle").textContent=f.title;
document.getElementById("detailMeta").textContent=
"⭐ "+f.rating+" · "+f.year+" · "+f.genre+" · "+f.time;
document.getElementById("detailDescription").textContent=f.desc;
document.getElementById("detailImage").src=posterUrl(f.id);
document.getElementById("trailerButton").onclick=()=>{
window.open("https://www.youtube.com/results?search_query="+encodeURIComponent(f.title+" трейлер"),"_blank");
};
document.getElementById("movieModal").classList.add("show");
document.body.style.overflow="hidden";
}

function closeMovie(){
document.getElementById("movieModal").classList.remove("show");
document.body.style.overflow="";
}

function outsideClose(event){
if(event.target.id==="movieModal")closeMovie();
}

document.addEventListener("keydown",event=>{
if(event.key==="Escape")closeMovie();
});

renderMovies();
</script>
</body>
</html>
