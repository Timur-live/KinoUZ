
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KinoUZ — Мир кино</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101018;color:white;font-family:Arial,sans-serif}
header{background:#191923;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.logo{font-size:27px;font-weight:bold;color:#ff4545}
.logo span{color:white}
button{cursor:pointer;border:0;border-radius:9px;padding:11px 15px;font-weight:bold}
.lang{background:#292936;color:white}
.hero{padding:55px 6%;background:linear-gradient(100deg,#28121d,#171727);text-align:center}
.hero h1{font-size:36px;margin:0 0 12px}
.hero p{color:#c6c6d0}
.search{width:90%;max-width:480px;padding:15px;border-radius:10px;border:0;margin-top:18px;font-size:16px}
main{padding:25px 5%}
h2{margin-top:15px}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}
.filters button{background:#292936;color:white}
.filters button.active{background:#ff4545}
.movies{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.movie{background:#1d1d29;border-radius:12px;overflow:hidden}
.poster{height:190px;display:flex;align-items:center;justify-content:center;text-align:center;padding:15px;font-size:25px;font-weight:bold;background:linear-gradient(145deg,#71314b,#17172c)}
.movie:nth-child(2) .poster{background:linear-gradient(145deg,#184d62,#17172c)}
.movie:nth-child(3) .poster{background:linear-gradient(145deg,#72521e,#21172c)}
.movie:nth-child(4) .poster{background:linear-gradient(145deg,#315d39,#17172c)}
.info{padding:13px}
.info h3{margin:0 0 8px}
.info p{font-size:13px;color:#b9b9c5;min-height:34px}
.trailer{background:#ff4545;color:white;width:100%}
footer{text-align:center;padding:25px;color:#888;background:#191923;margin-top:30px}
@media(min-width:700px){.movies{grid-template-columns:repeat(4,1fr)}.poster{height:260px}}
</style>
</head>
<body>
<header>
<div class="logo">Kino<span>UZ</span></div>
<button class="lang" onclick="changeLang()" id="lang">O‘zbekcha</button>
</header>

<section class="hero">
<h1 id="heading">Смотри кино вместе с KinoUZ</h1>
<p id="subtitle">Мир фильмов и сериалов в одном месте</p>
<input class="search" id="search" placeholder="Найти фильм..." oninput="render()">
</section>

<main>
<h2 id="catalog">Популярные фильмы</h2>
<div class="filters">
<button class="active" onclick="filter('all',this)" id="all">Все</button>
<button onclick="filter('Боевик',this)" id="action">Боевики</button>
<button onclick="filter('Комедия',this)" id="comedy">Комедии</button>
<button onclick="filter('Драма',this)" id="drama">Драмы</button>
</div>
<div class="movies" id="movies"></div>
</main>

<footer>KinoUZ © 2026 — <span id="foot">Твой мир кино</span></footer>

<script>
const films=[
{ru:"Интерстеллар",uz:"Interstellar",genre:"Драма",desc:"Путешествие за пределы Земли",emoji:"🚀"},
{ru:"Форсаж",uz:"Forsaj",genre:"Боевик",desc:"Скорость, машины и приключения",emoji:"🏎️"},
{ru:"1+1",uz:"1+1",genre:"Комедия",desc:"История настоящей дружбы",emoji:"🤝"},
{ru:"Начало",uz:"Boshlanish",genre:"Драма",desc:"Мир снов и загадок",emoji:"🌌"}
];
let lang="ru",category="all";
function render(){
const q=document.getElementById("search").value.toLowerCase();
document.getElementById("movies").innerHTML=films.filter(f=>
(category==="all"||f.genre===category)&&
(f.ru.toLowerCase().includes(q)||f.uz.toLowerCase().includes(q))
).map(f=>`
<div class="movie">
<div class="poster">${f.emoji}<br>${lang==="ru"?f.ru:f.uz}</div>
<div class="info">
<h3>${lang==="ru"?f.ru:f.uz}</h3>
<p>${lang==="ru"?f.desc:f.uz}</p>
<button class="trailer" onclick="trailer('${f.ru}')">${lang==="ru"?"Смотреть трейлер":"Treylerni ko‘rish"}</button>
</div></div>`).join("");
}
function filter(c,b){
category=c;
document.querySelectorAll(".filters button").forEach(x=>x.classList.remove("active"));
b.classList.add("active");
render();
}
function trailer(name){
window.open("https://www.youtube.com/results?search_query="+encodeURIComponent(name+" official trailer"),"_blank");
}
function changeLang(){
lang=lang==="ru"?"uz":"ru";
document.getElementById("lang").innerText=lang==="ru"?"O‘zbekcha":"Русский";
document.getElementById("heading").innerText=lang==="ru"?"Смотри кино вместе с KinoUZ":"KinoUZ bilan kino tomosha qiling";
document.getElementById("subtitle").innerText=lang==="ru"?"Мир фильмов и сериалов в одном месте":"Filmlar va seriallar olami bir joyda";
document.getElementById("catalog").innerText=lang==="ru"?"Популярные фильмы":"Mashhur filmlar";
document.getElementById("search").placeholder=lang==="ru"?"Найти фильм...":"Film qidirish...";
document.getElementById("all").innerText=lang==="ru"?"Все":"Barchasi";
document.getElementById("action").innerText=lang==="ru"?"Боевики":"Jangari";
document.getElementById("comedy").innerText=lang==="ru"?"Комедии":"Komediya";
document.getElementById("drama").innerText=lang==="ru"?"Драмы":"Drama";
document.getElementById("foot").innerText=lang==="ru"?"Твой мир кино":"Sening kino olaming";
render();
}
render();
</script>
</body>
</html>
