

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KinoUZ — Онлайн кинотеатр</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090d18;color:white;font-family:Arial,sans-serif}
header{background:#111827;padding:20px;text-align:center;border-bottom:1px solid #293247}
.logo{font-size:30px;font-weight:bold;color:#ff3434}
.logo span{color:white}
header p{color:#aaa;margin:7px}
.search{padding:15px}
input{width:100%;padding:15px;border:1px solid #333;border-radius:12px;background:#182235;color:white;font-size:16px}
h2{padding:0 15px;margin-top:15px}
.categories{display:flex;gap:9px;overflow-x:auto;padding:10px 15px}
.categories button{background:#202c40;color:white;border:0;border-radius:20px;padding:11px 17px;white-space:nowrap}
.categories button.active{background:#e32636}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px;padding:15px}
.movie{background:#151e30;border-radius:12px;overflow:hidden}
.movie img{width:100%;height:220px;object-fit:cover;background:#222}
.movie h3{font-size:15px;margin:10px}
.movie p{color:#aaa;font-size:12px;margin:0 10px 10px}
.movie button{width:calc(100% - 20px);margin:0 10px 12px;padding:11px;border:0;border-radius:8px;background:#e32636;color:white;font-weight:bold}
footer{text-align:center;color:#888;padding:25px}
.empty{text-align:center;color:#aaa;padding:30px}
</style>
</head>
<body>
<header>
<div class="logo">Kino<span>UZ</span> 🎬</div>
<p>Твой мир кино начинается здесь</p>
</header>

<div class="search">
<input id="search" placeholder="🔎 Найти фильм..." oninput="render()">
</div>

<h2>Категории</h2>
<div class="categories">
<button class="active" onclick="category('Все',this)">Все</button>
<button onclick="category('Боевик',this)">Боевики</button>
<button onclick="category('Комедия',this)">Комедии</button>
<button onclick="category('Ужасы',this)">Ужасы</button>
<button onclick="category('Драма',this)">Драмы</button>
<button onclick="category('Фантастика',this)">Фантастика</button>
</div>

<h2>🔥 Популярные фильмы</h2>
<div class="grid" id="movies"></div>

<footer>KinoUZ © 2026<br>Твой онлайн-кинотеатр</footer>

<script>
const films=[
{n:"Начало",c:"Фантастика",y:2010,i:"https://image.tmdb.org/t/p/w500/oYuLEt3zVCKq57qu2F8dT7NIa6f.jpg",url:"https://www.themoviedb.org/movie/27205-inception"},
{n:"Интерстеллар",c:"Фантастика",y:2014,i:"https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg",url:"https://www.themoviedb.org/movie/157336-interstellar"},
{n:"Джон Уик",c:"Боевик",y:2014,i:"https://image.tmdb.org/t/p/w500/fZPSd91yGE9fCcCe6OoQr6E3Bev.jpg",url:"https://www.themoviedb.org/movie/245891-john-wick"},
{n:"Маска",c:"Комедия",y:1994,i:"https://image.tmdb.org/t/p/w500/6v3qJqD0qK6XzY7qW7q.jpg",url:"https://www.themoviedb.org/movie/931-the-mask"},
{n:"Оно",c:"Ужасы",y:2017,i:"https://image.tmdb.org/t/p/w500/9E2y5Q7WlCVNEhP5GiVTjhEhx1o.jpg",url:"https://www.themoviedb.org/movie/346364-it"},
{n:"Зелёная миля",c:"Драма",y:1999,i:"https://image.tmdb.org/t/p/w500/8VG8fDNiy50H4FedGwdSVUPoaJe.jpg",url:"https://www.themoviedb.org/movie/497-the-green-mile"}
];
let selected="Все";
function category(c,b){
selected=c;
document.querySelectorAll(".categories button").forEach(x=>x.classList.remove("active"));
b.classList.add("active");
render();
}
function render(){
let q=document.getElementById("search").value.toLowerCase();
let list=films.filter(f=>(selected==="Все"||f.c===selected)&&f.n.toLowerCase().includes(q));
document.getElementById("movies").innerHTML=list.length?list.map(f=>`
<div class="movie">
<img src="${f.i}" alt="${f.n}" onerror="this.style.display='none'">
<h3>${f.n}</h3>
<p>${f.y} • ${f.c}</p>
<button onclick="window.open('${f.url}','_blank')">Подробнее ▶</button>
</div>`).join(""):'<div class="empty">Фильмы не найдены</div>';
}
render();
</script>
</body>
</html>
