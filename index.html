

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KinoUZ — Мир кино</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#090d18;color:white;font-family:Arial,sans-serif}
header{background:#111827;padding:20px 5%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px}
.logo{font-size:30px;font-weight:bold;color:#ff3838}
.logo span{color:white}
nav a{color:white;text-decoration:none;margin:0 10px;font-size:14px}
nav a:hover{color:#ff3838}
.hero{padding:65px 7%;background:linear-gradient(90deg,#101827,#202c45);min-height:260px}
.hero h1{font-size:40px;margin-bottom:15px}
.hero p{color:#cbd5e1;font-size:17px;margin-bottom:25px}
.btn{background:#e92335;color:white;padding:13px 24px;border:0;border-radius:7px;cursor:pointer;font-weight:bold}
.search{padding:25px 5%;display:flex;gap:10px}
.search input{width:100%;padding:14px;background:#1b2435;border:1px solid #344158;border-radius:7px;color:white;font-size:16px}
h2{padding:15px 5%;font-size:25px}
.categories{display:flex;gap:10px;padding:10px 5%;flex-wrap:wrap}
.categories button{background:#202b40;color:white;border:0;padding:10px 17px;border-radius:20px;cursor:pointer}
.categories button.active,.categories button:hover{background:#e92335}
.movies{padding:20px 5%;display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:20px}
.movie{background:#151e2e;border-radius:10px;overflow:hidden;transition:.3s}
.movie:hover{transform:translateY(-5px)}
.poster{height:225px;display:flex;align-items:center;justify-content:center;font-size:65px;background:linear-gradient(145deg,#263b60,#111827)}
.movie h3{padding:12px 10px 5px;font-size:16px}
.movie p{padding:0 10px 10px;color:#aab5c7;font-size:13px}
.movie button{margin:0 10px 12px;padding:9px;background:#e92335;color:white;border:0;border-radius:5px;cursor:pointer}
footer{background:#111827;padding:30px;text-align:center;color:#9ca3af;margin-top:30px}
.empty{text-align:center;padding:30px;color:#aaa;display:none}
@media(max-width:600px){
.hero h1{font-size:29px}
nav{width:100%}
nav a{margin-right:12px;margin-left:0}
.movies{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.poster{height:190px}
}
</style>
</head>
<body>

<header>
<div class="logo">Kino<span>UZ</span></div>
<nav>
<a href="#home">Главная</a>
<a href="#movies">Фильмы</a>
<a href="#genres">Жанры</a>
</nav>
</header>

<section class="hero" id="home">
<h1>Добро пожаловать в KinoUZ!</h1>
<p>Твой мир кино. Выбирай фильмы и открывай новые истории.</p>
<a href="#movies"><button class="btn">Смотреть каталог</button></a>
</section>

<div class="search">
<input id="search" type="text" placeholder="🔍 Найти фильм..." oninput="renderMovies()">
</div>

<h2 id="genres">Категории фильмов</h2>
<div class="categories">
<button class="active" onclick="setGenre('Все',this)">Все</button>
<button onclick="setGenre('Боевик',this)">Боевики</button>
<button onclick="setGenre('Комедия',this)">Комедии</button>
<button onclick="setGenre('Драма',this)">Драмы</button>
<button onclick="setGenre('Фантастика',this)">Фантастика</button>
<button onclick="setGenre('Приключения',this)">Приключения</button>
</div>

<h2 id="movies">Популярные фильмы</h2>
<div class="movies" id="movieList"></div>
<div class="empty" id="empty">Фильмы не найдены.</div>

<footer>
<h2>KinoUZ</h2>
<p>Твой любимый кинотеатр в интернете</p>
<p>© 2026 KinoUZ. Все права защищены.</p>
</footer>

<script>
const films=[
{title:"Интерстеллар",genre:"Фантастика",year:2014,emoji:"🚀"},
{title:"Начало",genre:"Фантастика",year:2010,emoji:"🌌"},
{title:"Джон Уик",genre:"Боевик",year:2014,emoji:"🔫"},
{title:"Форсаж",genre:"Боевик",year:2023,emoji:"🏎️"},
{title:"Маска",genre:"Комедия",year:1994,emoji:"🎭"},
{title:"Один дома",genre:"Комедия",year:1990,emoji:"🏠"},
{title:"Зелёная миля",genre:"Драма",year:1999,emoji:"🎬"},
{title:"Побег из Шоушенка",genre:"Драма",year:1994,emoji:"⛓️"},
{title:"Аватар",genre:"Фантастика",year:2009,emoji:"🌍"},
{title:"Пираты Карибского моря",genre:"Приключения",year:2003,emoji:"🏴‍☠️"},
{title:"Гладиатор",genre:"Боевик",year:2000,emoji:"⚔️"},
{title:"Джуманджи",genre:"Приключения",year:2017,emoji:"🦁"}
];

let selectedGenre="Все";

function setGenre(genre,button){
selectedGenre=genre;
document.querySelectorAll(".categories button").forEach(b=>b.classList.remove("active"));
button.classList.add("active");
renderMovies();
}

function renderMovies(){
const query=document.getElementById("search").value.toLowerCase();
const list=document.getElementById("movieList");
list.innerHTML="";
const filtered=films.filter(f=>
f.title.toLowerCase().includes(query)&&
(selectedGenre==="Все"||f.genre===selectedGenre)
);
document.getElementById("empty").style.display=filtered.length?"none":"block";
filtered.forEach(f=>{
const card=document.createElement("div");
card.className="movie";
card.innerHTML=`
<div class="poster">${f.emoji}</div>
<h3></h3>
<p>${f.year} · ${f.genre}</p>
<button>Найти трейлер</button>`;
card.querySelector("h3").textContent=f.title;
card.querySelector("button").onclick=()=>{
window.open("https://www.youtube.com/results?search_query="+encodeURIComponent(f.title+" официальный трейлер"),"_blank");
};
list.appendChild(card);
});
}
renderMovies();
</script>
</body>
</html>
