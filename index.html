
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KinoUZ — Мир кино</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#10131c;color:#fff;font-family:Arial,sans-serif}
header{background:#171c29;padding:17px 5%;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
.logo{font-size:27px;font-weight:900;color:#45a5ff}
.logo span{color:white}
nav{display:flex;gap:17px;flex-wrap:wrap}
nav a{color:#ddd;text-decoration:none;font-size:14px}
nav a:hover{color:#45a5ff}
.lang{background:#27364d;color:white;border:0;padding:9px 13px;border-radius:8px}
.hero{margin:22px auto;width:90%;min-height:300px;border-radius:18px;padding:35px;display:flex;align-items:end;background:linear-gradient(90deg,#10131c 5%,#152c4d 55%,#354c70);overflow:hidden}
.hero small{color:#65b7ff}
.hero h1{font-size:38px;margin:12px 0}
.hero p{color:#d0d9e7;max-width:440px;line-height:1.6}
.btn{display:inline-block;margin-top:18px;background:#258cf0;color:white;padding:12px 22px;border-radius:9px;text-decoration:none;font-weight:bold;border:0;cursor:pointer}
.container{width:90%;margin:30px auto}
.heading{font-size:24px;margin-bottom:18px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
input,select{background:#202838;border:1px solid #34445b;color:white;padding:13px;border-radius:9px;font-size:14px}
input{flex:1;min-width:180px}
select{min-width:140px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:19px}
.movie{background:#1a2231;border-radius:12px;overflow:hidden;transition:.2s}
.movie:hover{transform:translateY(-5px);box-shadow:0 8px 25px #0008}
.poster{height:220px;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;font-size:23px;font-weight:900;position:relative;background:linear-gradient(145deg,#174d80,#172238)}
.poster:after{content:"KinoUZ";position:absolute;bottom:10px;left:10px;font-size:11px;color:#ffffff9c}
.movie h3{font-size:15px;padding:11px 10px 5px}
.info{color:#a9b7ca;font-size:12px;padding:0 10px 10px}
.watch{display:block;margin:0 10px 12px;text-align:center;padding:9px;background:#258cf0;color:white;border-radius:7px;text-decoration:none;font-size:13px}
.empty{color:#aab5c5;padding:30px;text-align:center;grid-column:1/-1}
footer{text-align:center;padding:30px;color:#8594aa;background:#171c29;margin-top:45px}
@media(max-width:600px){
header{padding:14px 5%}
.hero{min-height:260px;padding:23px}
.hero h1{font-size:29px}
.container{width:92%}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.poster{height:205px}
}
</style>
</head>
<body>

<header>
<div class="logo">Kino<span>UZ</span></div>
<nav>
<a href="#home" id="homeLink">Главная</a>
<a href="#movies" id="moviesLink">Фильмы</a>
<a href="#new" id="newLink">Новинки</a>
</nav>
<button class="lang" onclick="changeLang()" id="langBtn">UZ / RU</button>
</header>

<section class="hero" id="home">
<div>
<small>МИР КИНО В ОДНОМ МЕСТЕ</small>
<h1 id="heroTitle">Смотри. Выбирай. Наслаждайся.</h1>
<p id="heroText">Открывай новые фильмы, находи любимые жанры и наслаждайся атмосферой большого кино.</p>
<a class="btn" href="#movies" id="heroBtn">Смотреть каталог</a>
</div>
</section>

<main class="container" id="movies">
<h2 class="heading" id="catalogTitle">Популярные фильмы</h2>
<div class="tools">
<input id="search" placeholder="Поиск фильма..." oninput="render()">
<select id="genre" onchange="render()">
<option value="all">Все жанры</option>
<option>Боевик</option>
<option>Комедия</option>
<option>Драма</option>
<option>Фантастика</option>
<option>Приключения</option>
</select>
</div>
<div class="grid" id="grid"></div>
</main>

<footer>
<div class="logo">KinoUZ</div>
<p style="margin-top:10px">Твой мир кино · 2026</p>
<p style="margin-top:8px;font-size:12px">© KinoUZ. Информация о фильмах представлена для ознакомления.</p>
</footer>

<script>
const movies=[
["Интерстеллар","Фантастика",2014,"#243c63"],
["Начало","Боевик",2010,"#563a72"],
["Аватар","Приключения",2009,"#176b81"],
["Джокер","Драма",2019,"#824d36"],
["Гладиатор","Боевик",2000,"#754b36"],
["Один дома","Комедия",1990,"#9b5839"],
["Матрица","Фантастика",1999,"#205e51"],
["Титаник","Драма",1997,"#31577d"],
["Веном","Боевик",2018,"#493b49"],
["Дюна","Фантастика",2021,"#8b633c"],
["Пираты Карибского моря","Приключения",2003,"#59432e"],
["Маска","Комедия",1994,"#467c48"],
["Форрест Гамп","Драма",1994,"#476b8d"],
["Мстители","Боевик",2012,"#713c46"],
["Гарри Поттер","Приключения",2001,"#493b76"],
["Терминатор","Фантастика",1984,"#414b59"]
];

let uz=false;

function render(){
const q=document.getElementById("search").value.toLowerCase();
const g=document.getElementById("genre").value;
const list=movies.filter(m=>
m[0].toLowerCase().includes(q)&&
(g==="all"||m[1]===g)
);
const grid=document.getElementById("grid");
grid.innerHTML="";
if(!list.length){
grid.innerHTML='<div class="empty">Фильмы не найдены</div>';
return;
}
list.forEach(m=>{
const card=document.createElement("article");
card.className="movie";
const poster=document.createElement("div");
poster.className="poster";
poster.style.background=`linear-gradient(145deg,${m[3]},#111827)`;
poster.textContent=m[0];
const title=document.createElement("h3");
title.textContent=m[0];
const info=document.createElement("div");
info.className="info";
info.textContent=m[1]+" · "+m[2];
const link=document.createElement("a");
link.className="watch";
link.target="_blank";
link.rel="noopener";
link.href="https://www.youtube.com/results?search_query="+encodeURIComponent(m[0]+" официальный трейлер");
link.textContent=uz?"Трейлер":"Смотреть трейлер";
card.append(poster,title,info,link);
grid.appendChild(card);
});
}

function changeLang(){
uz=!uz;
document.documentElement.lang=uz?"uz":"ru";
document.getElementById("homeLink").textContent=uz?"Bosh sahifa":"Главная";
document.getElementById("moviesLink").textContent=uz?"Filmlar":"Фильмы";
document.getElementById("newLink").textContent=uz?"Yangiliklar":"Новинки";
document.getElementById("heroTitle").textContent=uz?"Ko‘r. Tanla. Zavqlan.":"Смотри. Выбирай. Наслаждайся.";
document.getElementById("heroText").textContent=uz?"Yangi filmlarni kashf et va sevimli janrlaringni top.":"Открывай новые фильмы, находи любимые жанры и наслаждайся атмосферой большого кино.";
document.getElementById("heroBtn").textContent=uz?"Katalogni ko‘rish":"Смотреть каталог";
document.getElementById("catalogTitle").textContent=uz?"Mashhur filmlar":"Популярные фильмы";
document.getElementById("search").placeholder=uz?"Film qidirish...":"Поиск фильма...";
document.getElementById("langBtn").textContent=uz?"UZ / RU":"RU / UZ";
const genre=document.getElementById("genre");
const names=uz?["Barcha janrlar","Jangari","Komediya","Drama","Fantastika","Sarguzasht"]:
["Все жанры","Боевик","Комедия","Драма","Фантастика","Приключения"];
[...genre.options].forEach((o,i)=>o.textContent=names[i]);
render();
}
render();
</script>
</body>
</html>
