

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KinoUZ PREMIUM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080808;color:#fff;font-family:Arial,sans-serif}
header{height:75px;background:#101010;border-bottom:1px solid #b18a38;display:flex;align-items:center;justify-content:space-between;padding:0 5%;gap:15px}
.logo{font-size:29px;font-weight:bold;color:#d7ae54}
.logo span{color:white}
nav{display:flex;gap:20px}
nav a{color:#ddd;text-decoration:none;font-size:14px}
nav a:hover{color:#d7ae54}
.hero{min-height:390px;padding:90px 7%;background:linear-gradient(90deg,#080808 15%,rgba(8,8,8,.82),rgba(8,8,8,.1)),url('https://image.tmdb.org/t/p/original/8b8R8l88Qje9dn9OE8PY05Nxl1X.jpg') center/cover}
.tag{color:#d7ae54;letter-spacing:4px;font-size:12px}
.hero h1{font-size:48px;margin:18px 0}
.hero p{color:#ccc;max-width:480px;line-height:1.7}
.goldbtn{background:linear-gradient(90deg,#a77a29,#f2d17b);color:#111;border:0;padding:14px 25px;border-radius:5px;font-weight:bold;cursor:pointer;margin-top:25px}
.search{padding:25px 5%}
.search input{width:100%;padding:15px;background:#181818;border:1px solid #8b6a2d;color:white;border-radius:5px;font-size:16px}
h2{padding:10px 5%;font-size:24px}
h2 span{color:#d7ae54}
.categories{display:flex;gap:10px;padding:15px 5%;overflow-x:auto}
.categories button{background:#191919;border:1px solid #604b28;color:white;padding:10px 18px;border-radius:20px;white-space:nowrap;cursor:pointer}
.categories button.active,.categories button:hover{background:#d7ae54;color:#111}
.movies{padding:20px 5%;display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:20px}
.movie{background:#151515;border:1px solid #29231a;border-radius:8px;overflow:hidden;transition:.3s}
.movie:hover{transform:translateY(-6px);border-color:#d7ae54}
.poster{height:230px;position:relative;background:#202020}
.poster img{width:100%;height:100%;object-fit:cover}
.rating{position:absolute;top:9px;right:9px;background:#d7ae54;color:#111;padding:5px 8px;border-radius:4px;font-size:12px;font-weight:bold}
.movie h3{padding:12px 10px 6px;font-size:15px}
.movie p{padding:0 10px 10px;color:#aaa;font-size:12px}
.movie button{margin:0 10px 12px;background:#d7ae54;color:#111;border:0;padding:9px 12px;border-radius:4px;cursor:pointer;font-weight:bold}
.empty{text-align:center;color:#aaa;padding:30px;display:none}
footer{text-align:center;padding:35px;background:#101010;border-top:1px solid #705626;color:#999;margin-top:30px}
footer strong{color:#d7ae54;font-size:25px}
@media(max-width:600px){
header{height:auto;padding:18px 5%;flex-wrap:wrap}
nav{width:100%;gap:14px}
.hero{padding:65px 6%;min-height:330px}
.hero h1{font-size:34px}
.movies{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.poster{height:200px}
}
</style>
</head>
<body>
<header>
<div class="logo">Kino<span>UZ</span></div>
<nav>
<a href="#home">Главная</a>
<a href="#movies">Фильмы</a>
<a href="#genres">Жанры</a>
</nav>
</header>

<section class="hero" id="home">
<div class="tag">KINO UZ • PREMIUM</div>
<h1>Мир большого кино</h1>
<p>Открой для себя лучшие фильмы. Большие истории, незабываемые эмоции и настоящий кинематограф.</p>
<button class="goldbtn" onclick="document.getElementById('movies').scrollIntoView({behavior:'smooth'})">Смотреть фильмы ▶</button>
</section>

<div class="search">
<input id="search" placeholder="🔍 Поиск любимого фильма..." oninput="renderMovies()">
</div>

<h2 id="genres">Выбери <span>жанр</span></h2>
<div class="categories">
<button class="active" onclick="setGenre('Все',this)">Все</button>
<button onclick="setGenre('Боевик',this)">Боевики</button>
<button onclick="setGenre('Комедия',this)">Комедии</button>
<button onclick="setGenre('Драма',this)">Драмы</button>
<button onclick="setGenre('Фантастика',this)">Фантастика</button>
<button onclick="setGenre('Приключения',this)">Приключения</button>
</div>

<h2 id="movies">Премьера <span>кино</span></h2>
<div class="movies" id="movieList"></div>
<div class="empty" id="empty">Ничего не найдено</div>

<footer>
<strong>KinoUZ PREMIUM</strong>
<p style="margin-top:12px">Твой мир большого кино</p>
<p style="margin-top:10px">© 2026 KinoUZ</p>
</footer>

<script>
const films=[
{title:"Интерстеллар",genre:"Фантастика",year:2014,rating:"8.7",id:157336},
{title:"Начало",genre:"Фантастика",year:2010,rating:"8.8",id:27205},
{title:"Джон Уик",genre:"Боевик",year:2014,rating:"7.4",id:245891},
{title:"Форсаж 7",genre:"Боевик",year:2015,rating:"7.1",id:168259},
{title:"Маска",genre:"Комедия",year:1994,rating:"6.9",id:9312},
{title:"Один дома",genre:"Комедия",year:1990,rating:"7.7",id:771},
{title:"Зелёная миля",genre:"Драма",year:1999,rating:"8.6",id:497},
{title:"Побег из Шоушенка",genre:"Драма",year:1994,rating:"9.3",id:278},
{title:"Аватар",genre:"Фантастика",year:2009,rating:"7.9",id:19995},
{title:"Гладиатор",genre:"Боевик",year:2000,rating:"8.2",id:98},
{title:"Джуманджи",genre:"Приключения",year:2017,rating:"6.9",id:353486},
{title:"Пираты Карибского моря",genre:"Приключения",year:2003,rating:"8.1",id:22}
];

let selectedGenre="Все";

function setGenre(genre,button){
selectedGenre=genre;
document.querySelectorAll(".categories button").forEach(b=>b.classList.remove("active"));
button.classList.add("active");
renderMovies();
}

function renderMovies(){
const query=document.getElementById("search").value.toLowerCase();
const list=document.getElementById("movieList");
list.innerHTML="";
const filtered=films.filter(f=>
f.title.toLowerCase().includes(query)&&
(selectedGenre==="Все"||f.genre===selectedGenre)
);
document.getElementById("empty").style.display=filtered.length?"none":"block";
filtered.forEach(f=>{
const card=document.createElement("div");
card.className="movie";
card.innerHTML=`
<div class="poster">
<img loading="lazy" src="https://image.tmdb.org/t/p/w500/${getPoster(f.id)}" alt="">
<div class="rating">⭐ ${f.rating}</div>
</div>
<h3></h3>
<p>${f.year} · ${f.genre}</p>
<button>▶ Трейлер</button>`;
card.querySelector("h3").textContent=f.title;
card.querySelector("img").onerror=function(){
this.style.display="none";
this.parentElement.style.background="linear-gradient(145deg,#604b28,#151515)";
};
card.querySelector("button").onclick=()=>{
window.open("https://www.youtube.com/results?search_query="+encodeURIComponent(f.title+" трейлер"),"_blank");
};
list.appendChild(card);
});
}

function getPoster(id){
const posters={
157336:"gEU2QniE6E77NI6lCU6MxlNBvIx.jpg",
27205:"oYuLEt3zVCKq57qu2F8dT7NIa6f.jpg",
245891:"fZPSd91yGE9fCcCe6OoQr6E3Bev.jpg",
168259:"dCgm7efXDmiABSdWDHBDBx2jwmn.jpg",
9312:"a0W7buhwZqYf8a6mFqD7J3G5J9a.jpg",
771:"uuitWHpJwxD1wruFl2nZHIb4UGN.jpg",
497:"velWPhVMQeQKcxggNEU8YmIo52R.jpg",
278:"hBcY0fE9pfXzvVaY4GKarweri1f.jpg",
19995:"kyeqWdyUXW608qlYkRqosgbbJyK.jpg",
98:"ty8TGRuvJLPUmAR1H1nRIsgwvim.jpg",
353486:"bB42KDdfWkOvmzmYkmK58ZlCa9P.jpg",
22:"tkt9xR1kNX5R9rCebASKck44si2.jpg"
};
return posters[id]||"";
}
renderMovies();
</script>
</body>
</html
