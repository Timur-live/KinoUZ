

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KinoUZ — Смотреть фильмы</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#090b12;color:white;font-family:Arial,sans-serif}
header{height:70px;padding:0 5%;display:flex;align-items:center;justify-content:space-between;background:#10131d;position:sticky;top:0;z-index:10}
.logo{font-size:27px;font-weight:bold;color:#ff3535}
.logo span{color:white}
nav{display:flex;gap:20px}
nav a{color:#ddd;text-decoration:none;font-size:14px}
.hero{margin:20px auto;width:92%;min-height:340px;border-radius:18px;display:flex;align-items:end;padding:30px;background:linear-gradient(90deg,#090b12 5%,#090b1288 60%,transparent),url('https://image.tmdb.org/t/p/original/8b8R8l88Qje9dn9OE8PY05Nxl1X.jpg') center/cover}
.hero-content{max-width:500px}
.tag{background:#ff3030;padding:7px 12px;border-radius:5px;font-size:12px}
.hero h1{font-size:38px;margin:18px 0 10px}
.hero p{color:#ddd;line-height:1.5;margin-bottom:20px}
.btn{background:#ff3030;color:white;border:0;padding:13px 22px;border-radius:8px;font-weight:bold;cursor:pointer}
.btn:hover{background:#d91e1e}
.container{width:92%;margin:30px auto}
.section-title{font-size:23px;margin-bottom:20px}
.search{width:100%;padding:15px;border:1px solid #303443;background:#151925;color:white;border-radius:10px;margin-bottom:20px;font-size:15px;outline:none}
.categories{display:flex;gap:10px;overflow-x:auto;margin-bottom:25px;padding-bottom:8px}
.category{white-space:nowrap;padding:10px 17px;border:1px solid #343949;background:#151925;color:white;border-radius:20px;cursor:pointer}
.category.active,.category:hover{background:#ff3030;border-color:#ff3030}
.movies{display:grid;grid-template-columns:repeat(5,1fr);gap:18px}
.movie{background:#151925;border-radius:12px;overflow:hidden;cursor:pointer;transition:.2s}
.movie:hover{transform:translateY(-5px)}
.movie img{width:100%;height:230px;object-fit:cover;display:block;background:#222}
.movie-info{padding:12px}
.movie h3{font-size:15px;margin-bottom:8px}
.movie small{color:#aaa}
.rating{color:#ffc443;font-size:13px;margin-bottom:8px}
footer{text-align:center;padding:30px;color:#777;background:#10131d;margin-top:40px}
.modal{display:none;position:fixed;inset:0;background:#000d;z-index:20;align-items:center;justify-content:center;padding:15px}
.modal-box{background:#171b28;width:100%;max-width:500px;border-radius:15px;overflow:hidden;max-height:90vh;overflow-y:auto}
.modal img{width:100%;height:240px;object-fit:cover}
.modal-content{padding:22px}
.modal-content h2{margin-bottom:12px}
.modal-content p{color:#ccc;line-height:1.6;margin:12px 0 20px}
.close{float:right;background:#333;color:white;border:0;padding:9px 13px;border-radius:6px;cursor:pointer}
.empty{color:#aaa;padding:30px 0;text-align:center;grid-column:1/-1}
@media(max-width:850px){.movies{grid-template-columns:repeat(3,1fr)}}
@media(max-width:550px){
header{padding:0 4%;height:60px}
.logo{font-size:23px}
nav{gap:10px}
nav a{font-size:12px}
.hero{min-height:300px;padding:20px;background-position:center}
.hero h1{font-size:29px}
.movies{grid-template-columns:repeat(2,1fr);gap:12px}
.movie img{height:210px}
.container{width:92%}
}
</style>
</head>
<body>

<header>
<div class="logo">Kino<span>UZ</span></div>
<nav>
<a href="#">Главная</a>
<a href="#catalog">Фильмы</a>
<a href="#footer">О нас</a>
</nav>
</header>

<section class="hero">
<div class="hero-content">
<span class="tag">ПРЕМЬЕРА</span>
<h1>Мир кино начинается здесь</h1>
<p>Открывай новые фильмы, выбирай любимые жанры и знакомься с кинопремьерами на KinoUZ.</p>
<button class="btn" onclick="document.getElementById('catalog').scrollIntoView({behavior:'smooth'})">Смотреть фильмы</button>
</div>
</section>

<main class="container" id="catalog">
<h2 class="section-title">Каталог фильмов</h2>
<input class="search" id="search" placeholder="🔍 Поиск фильмов..." oninput="renderMovies()">

<div class="categories">
<button class="category active" onclick="setCategory('Все',this)">Все</button>
<button class="category" onclick="setCategory('Боевик',this)">Боевики</button>
<button class="category" onclick="setCategory('Комедия',this)">Комедии</button>
<button class="category" onclick="setCategory('Драма',this)">Драмы</button>
<button class="category" onclick="setCategory('Фантастика',this)">Фантастика</button>
<button class="category" onclick="setCategory('Приключения',this)">Приключения</button>
</div>

<div class="movies" id="movies"></div>
</main>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
<div class="modal-box">
<img id="modalImg" src="" alt="Постер фильма">
<div class="modal-content">
<button class="close" onclick="closeModal()">Закрыть ✕</button>
<h2 id="modalTitle"></h2>
<div class="rating" id="modalRating"></div>
<p id="modalDesc"></p>
<button class="btn" onclick="closeModal()">Вернуться в каталог</button>
</div>
</div>
</div>

<footer id="footer">
<div class="logo">Kino<span>UZ</span></div>
<p style="margin-top:12px">Твой мир кино • 2026</p>
<p style="margin-top:8px;font-size:12px">© KinoUZ. Все права защищены.</p>
</footer>

<script>
const movies=[
{title:"Начало",year:2010,genre:"Фантастика",rating:"8.8",img:"https://image.tmdb.org/t/p/w500/oYuLEt3zVCKq57qu2F8dT7NIa6f.jpg",desc:"Опытный специалист проникает в сны людей и получает необычное задание — внедрить идею в сознание человека."},
{title:"Интерстеллар",year:2014,genre:"Фантастика",rating:"8.7",img:"https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg",desc:"Группа исследователей отправляется в далёкое путешествие через космос ради будущего человечества."},
{title:"Джон Уик",year:2014,genre:"Боевик",rating:"7.4",img:"https://image.tmdb.org/t/p/w500/fZPSd91yGE9fCcCe6OoQr6E3Bev.jpg",desc:"Бывший наёмник возвращается к опасной жизни, когда его прошлое вновь напоминает о себе."},
{title:"Гладиатор",year:2000,genre:"Боевик",rating:"8.5",img:"https://image.tmdb.org/t/p/w500/ty8TGRuvJLPUmAR1H1nRIsgwvim.jpg",desc:"Римский полководец теряет всё и начинает борьбу за справедливость на арене."},
{title:"Зелёная миля",year:1999,genre:"Драма",rating:"8.6",img:"https://image.tmdb.org/t/p/w500/8VG8fDNiy50H4FedGwdSVUPoaJe.jpg",desc:"История необычного заключённого и людей, чьи судьбы изменились после встречи с ним."},
{title:"Форрест Гамп",year:1994,genre:"Драма",rating:"8.8",img:"https://image.tmdb.org/t/p/w500/arw2vcBveWOVZr6pxd9XTd1TdQa.jpg",desc:"Необыкновенная жизнь простого человека, который оказывается свидетелем исторических событий."},
{title:"Маска",year:1994,genre:"Комедия",rating:"7.0",img:"https://image.tmdb.org/t/p/w500/8v3Sqv9UcIUC4ebmpKWROqPBINZ.jpg",desc:"Скромный банковский служащий находит волшебную маску и превращается в невероятного героя."},
{title:"Один дома",year:1990,genre:"Комедия",rating:"7.7",img:"https://image.tmdb.org/t/p/w500/onTSipZ8R3bliBdKfPtsDuHTdlL.jpg",desc:"Мальчик случайно остаётся один дома на Рождество и готовит неожиданный сюрприз грабителям."},
{title:"Парк Юрского периода",year:1993,genre:"Приключения",rating:"8.2",img:"https://image.tmdb.org/t/p/w500/oU7Oq2kFAAlGqbU4VoAE36g4hoI.jpg",desc:"Учёные создают парк с настоящими динозаврами, но эксперимент выходит из-под контроля."},
{title:"Мстители",year:2012,genre:"Боевик",rating:"8.0",img:"https://image.tmdb.org/t/p/w500/RYMX2wcKCBAr24UyPD7xwmjaTn.jpg",desc:"Команда супергероев объединяется, чтобы защитить Землю от глобальной угрозы."},
{title:"Марсианин",year:2015,genre:"Фантастика",rating:"8.0",img:"https://image.tmdb.org/t/p/w500/5aGhaIHYuQbqlHWvWYqMCnj40y2.jpg",desc:"Астронавт оказывается один на Марсе и пытается выжить до прибытия спасательной миссии."},
{title:"Пираты Карибского моря",year:2003,genre:"Приключения",rating:"8.1",img:"https://image.tmdb.org/t/p/w500/poHwCZeWzJCShH7tOjg8RIoyjcw.jpg",desc:"Капитан Джек Воробей отправляется в невероятное морское приключение."}
];

let activeCategory="Все";

function renderMovies(){
const query=document.getElementById("search").value.toLowerCase();
const list=movies.filter(m=>
(m.title.toLowerCase().includes(query))&&
(activeCategory==="Все"||m.genre===activeCategory)
);
const container=document.getElementById("movies");
container.innerHTML="";
if(!list.length){
container.innerHTML='<div class="empty">Фильмы не найдены</div>';
return;
}
list.forEach(m=>{
const card=document.createElement("div");
card.className="movie";
card.innerHTML=`
<img src="${m.img}" alt="${m.title}" loading="lazy">
<div class="movie-info">
<div class="rating">★ ${m.rating}</div>
<h3>${m.title}</h3>
<small>${m.year} • ${m.genre}</small>
</div>`;
card.onclick=()=>openModal(m);
container.appendChild(card);
});
}

function setCategory(category,button){
activeCategory=category;
document.querySelectorAll(".category").forEach(b=>b.classList.remove("active"));
button.classList.add("active");
renderMovies();
}

function openModal(movie){
document.getElementById("modalImg").src=movie.img;
document.getElementById("modalTitle").textContent=movie.title;
document.getElementById("modalRating").textContent="★ "+movie.rating+" | "+movie.year+" | "+movie.genre;
document.getElementById("modalDesc").textContent=movie.desc;
document.getElementById("modal").style.display="flex";
}

function closeModal(){
document.getElementById("modal").style.display="none";
}

document.addEventListener("keydown",e=>{
if(e.key==="Escape")closeModal();
});

renderMovies();
</script>
</body>
</html>
